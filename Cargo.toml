[package]
name = "aocat-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fluent-uri = "0.4"
geo-types = "0.7"
geojson = "1.0"
serde = { version = "1.0", features = ["derive"] }
wkt = "0.14"

[dev-dependencies]
serde_json = "1.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "warn"
implicit_clone = "deny"
unwrap_used = "deny"